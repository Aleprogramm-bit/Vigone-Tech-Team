<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Aleprogramm - OurVideos</title>
    <style>
        body { background: #0a0a0a; color: #c8ffc8; font-family: Arial; margin: 0; }

        /* Contenitore del logo */
        .logo-container {
            text-align: center;
            padding: 20px 0 10px 0;
        }

        .logo-container img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid #00ff66;
            object-fit: cover;
        }

        header { background: #000; padding: 15px; border-bottom: 2px solid #00ff66; }

        h1 { 
            text-align: center; 
            color: #00ff66; 
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px; 
            margin: 0;
        }

        .egg-link {
            display: inline-flex;
            align-items: center;
            cursor: pointer;
            text-decoration: none;
        }

        .egg-icon {
            width: 24px;         
            height: 30px;
            opacity: 0.4;
            vertical-align: middle;
            transition: all 0.2s ease;
        }

        .egg-link:hover .egg-icon {
            opacity: 0.9;
            transform: scale(1.1);
            filter: drop-shadow(0 0 5px #00ff66);
        }

        .card {
            background: #111;
            border: 1px solid #00ff66;
            border-radius: 10px;
            padding: 15px;
            margin: 15px;
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .card:hover { background: #1a1a1a; }

        .card img {
            width: 160px;
            height: 90px;
            border-radius: 8px;
            margin-right: 15px;
            object-fit: cover;
        }

        .title { font-size: 20px; color: #00ff66; }
    </style>
</head>
<body>

<!-- LOGO SOPRA A TUTTO -->
<div class="logo-container">
    <img src="ale.png" alt="Logo Profilo">
</div>

<header>
    <h1>
        Aleprogramm – Videos
        <a href="razzi.html" target="_blank" class="egg-link" title="Apri il gioco dei razzi!">
            <svg class="egg-icon" viewBox="0 0 100 120" xmlns="http://w3.org">
                <path d="M50,10 C25,10 10,55 10,80 C10,102 28,115 50,115 C72,115 90,102 90,80 C90,55 75,10 50,10 Z" fill="#00ff66"/>
            </svg>
        </a>
    </h1>
</header>

<div class="card" onclick="openVideo('https://mega.nz/embed/XXXXXXXX#YYYYYYYY')">
    <img src="1.png">
    <div class="title">Video 1</div>
</div>

<div class="card" onclick="openVideo('https://mega.nz/embed/AAAAAAAA#BBBBBBBB')">
    <img src="2.png">
    <div class="title">Video 2</div>
</div>

<script>
function openVideo(url) {
    window.open(url, "_blank");
}
</script>

</body>
</html>
