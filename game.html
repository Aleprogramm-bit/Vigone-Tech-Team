<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Snake – VigoneTech Team</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    :root {
        --bg: #0d0d0d;
        --text: #e8eaed;
        --border: #3c4043;
        --shadow: #00000055;
        --primary: #8ab4f8;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: radial-gradient(circle at top, #222 0, #000 60%);
        color: var(--text);
        text-align: center;
    }

    h1 {
        margin-top: 20px;
        font-size: 32px;
        text-shadow: 0 2px 6px var(--shadow);
    }

    /* MENU */
    #menu, #options, #credits {
        margin-top: 40px;
    }

    .btn {
        display: block;
        width: 240px;
        margin: 10px auto;
        padding: 12px;
        background: var(--primary);
        color: #fff;
        border-radius: 10px;
        text-decoration: none;
        font-size: 18px;
        font-weight: bold;
        box-shadow: 0 4px 12px var(--shadow);
        transition: 0.2s;
        cursor: pointer;
        border: none;
    }

    .btn:hover {
        filter: brightness(0.92);
        transform: translateY(-2px);
    }

    /* CANVAS */
    #gameCanvas {
        display: none;
        background: #111;
        margin: 30px auto 10px auto;
        border: 4px solid var(--border);
        box-shadow: 0 4px 16px #000;
    }

    #score {
        display: none;
        font-size: 22px;
        margin-top: 8px;
    }

    .back {
        margin-top: 20px;
        font-size: 16px;
        color: var(--primary);
        cursor: pointer;
        text-decoration: underline;
    }
</style>
</head>
<body>

<h1>Snake – VigoneTech Team</h1>

<!-- MENU PRINCIPALE -->
<div id="menu">
    <button class="btn" onclick="startGame()">Inizia</button>
    <button class="btn" onclick="showOptions()">Opzioni</button>
    <button class="btn" onclick="showCredits()">Crediti</button>
    <a class="btn" href="index.html">Indietro</a>
</div>

<!-- OPZIONI -->
<div id="options" style="display:none;">
    <h2>Opzioni</h2>
    <p>Velocità del gioco:</p>
    <button class="btn" onclick="setSpeed(140)">Lento</button>
    <button class="btn" onclick="setSpeed(90)">Normale</button>
    <button class="btn" onclick="setSpeed(60)">Veloce</button>
    <div class="back" onclick="backToMenu()">Indietro</div>
</div>

<!-- CREDITI -->
<div id="credits" style="display:none;">
    <h2>Crediti</h2>
    <p>Gioco Snake sviluppato da VigoneTech Team in HTML5, CSS e JS.</p>
    <p>Programmazione: LoreTnani</p>
    <div class="back" onclick="backToMenu()">Indietro</div>
</div>

<!-- GIOCO -->
<canvas id="gameCanvas" width="400" height="400"></canvas>
<div id="score">Punteggio: 0</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

let speed = 90;
let snake;
let direction;
let food;
let score;
let gameLoop = null;

document.addEventListener("keydown", keyPress);

function startGame() {
    document.getElementById("menu").style.display = "none";
    document.getElementById("options").style.display = "none";
    document.getElementById("credits").style.display = "none";

    canvas.style.display = "block";
    document.getElementById("score").style.display = "block";

    resetGame();
    startLoop();
}

function startLoop() {
    if (gameLoop) clearInterval(gameLoop);
    gameLoop = setInterval(update, speed);
}

function resetGame() {
    snake = [{x: 200, y: 200}];
    direction = "RIGHT";
    food = spawnFood();
    score = 0;
    document.getElementById("score").innerText = "Punteggio: 0";
}

function spawnFood() {
    return {
        x: Math.floor(Math.random() * 20) * 20,
        y: Math.floor(Math.random() * 20) * 20
    };
}

function keyPress(e) {
    if (e.key === "ArrowUp" && direction !== "DOWN") direction = "UP";
    if (e.key === "ArrowDown" && direction !== "UP") direction = "DOWN";
    if (e.key === "ArrowLeft" && direction !== "RIGHT") direction = "LEFT";
    if (e.key === "ArrowRight" && direction !== "LEFT") direction = "RIGHT";
}

function update() {
    const head = {x: snake[0].x, y: snake[0].y};

    if (direction === "UP") head.y -= 20;
    if (direction === "DOWN") head.y += 20;
    if (direction === "LEFT") head.x -= 20;
    if (direction === "RIGHT") head.x += 20;

    // WRAP-AROUND
    if (head.x < 0) head.x = 380;
    if (head.x > 380) head.x = 0;
    if (head.y < 0) head.y = 380;
    if (head.y > 380) head.y = 0;

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
        score++;
        document.getElementById("score").innerText = "Punteggio: " + score;
        food = spawnFood();
    } else {
        snake.pop();
    }

    if (collision(head)) {
        gameOver();
        return;
    }

    draw();
}

function collision(head) {
    return snake.slice(1).some(part => part.x === head.x && part.y === head.y);
}

function draw() {
    // sfondo campo
    ctx.fillStyle = "#111";
    ctx.fillRect(0, 0, 400, 400);

    // griglia leggera
    ctx.strokeStyle = "#222";
    ctx.lineWidth = 1;
    for (let i = 0; i <= 400; i += 20) {
        ctx.beginPath();
        ctx.moveTo(i, 0);
        ctx.lineTo(i, 400);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, i);
        ctx.lineTo(400, i);
        ctx.stroke();
    }

    // serpente
    snake.forEach((part, index) => {
        ctx.fillStyle = index === 0 ? "#4CAF50" : "#43A047";
        ctx.fillRect(part.x, part.y, 20, 20);
        ctx.strokeStyle = "#2E7D32";
        ctx.lineWidth = 2;
        ctx.strokeRect(part.x, part.y, 20, 20);
    });

    // cibo
    ctx.fillStyle = "#FF5252";
    ctx.shadowColor = "#FF5252";
    ctx.shadowBlur = 10;
    ctx.fillRect(food.x + 2, food.y + 2, 16, 16);
    ctx.shadowBlur = 0;
}

function gameOver() {
    clearInterval(gameLoop);
    alert("Game Over! Punteggio: " + score);
    backToMenu();
}

function showOptions() {
    document.getElementById("menu").style.display = "none";
    document.getElementById("options").style.display = "block";
    document.getElementById("credits").style.display = "none";
}

function showCredits() {
    document.getElementById("menu").style.display = "none";
    document.getElementById("options").style.display = "none";
    document.getElementById("credits").style.display = "block";
}

function backToMenu() {
    if (gameLoop) clearInterval(gameLoop);
    canvas.style.display = "none";
    document.getElementById("score").style.display = "none";
    document.getElementById("menu").style.display = "block";
    document.getElementById("options").style.display = "none";
    document.getElementById("credits").style.display = "none";
}

function setSpeed(s) {
    speed = s;
    alert("Velocità impostata: " + s + " ms");
    // se il gioco è attivo, riavvia il loop con la nuova velocità
    if (canvas.style.display === "block") {
        startLoop();
    }
}
</script>

</body>
</html>
