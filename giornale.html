<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Giornale Tecnologico</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
            --bg: #f5f5f5;
            --card-bg: #ffffff;
            --primary: #1a73e8;
            --text: #202124;
            --muted: #5f6368;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: url("back.png") no-repeat center center fixed;
            background-size: cover;
            color: var(--text);
        }

        header {
            background: #ffffffcc;
            border-bottom: 1px solid #dadce0;
            padding: 12px 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            backdrop-filter: blur(6px);
        }

        header .logo img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
        }

        header h1 {
            margin: 0;
            font-size: 22px;
        }

        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 16px;
        }

        h2 {
            font-size: 24px;
            margin-bottom: 20px;
        }

        .cards {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid #dadce0;
            border-radius: 10px;
            padding: 20px;
            width: 300px;
            text-align: center;
        }

        .card img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 10px;
        }

        .card h3 {
            margin: 10px 0;
            font-size: 20px;
        }

        .card p {
            font-size: 14px;
            color: var(--muted);
        }

        .btn {
            display: inline-block;
            margin-top: 12px;
            padding: 10px 16px;
            background: var(--primary);
            color: #fff;
            border-radius: 6px;
            text-decoration: none;
        }

        .btn:hover {
            filter: brightness(0.95);
        }
    </style>
</head>
<body>

<header>
    <div class="logo">
        <img src="techteam.jpg" alt="VigoneTech">
    </div>
    <h1>VigoneTech Team - Giornale Tecnologico</h1>
</header>
</body>
</html>
