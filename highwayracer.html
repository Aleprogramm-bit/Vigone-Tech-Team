<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Retro Highway Racer+</title>
<style>
    body {
        margin: 0;
        background: #111;
        color: white;
        font-family: 'Courier New', monospace;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        overflow: hidden;
    }

    #gameCanvas {
        border: 4px solid #fff;
        background: #000;
        box-shadow: 0 0 25px rgba(255,255,255,0.25);
    }

    .info {
        margin-top: 15px;
        text-align: center;
        font-size: 14px;
        opacity: 0.8;
    }
</style>
</head>
<body>

<canvas id="gameCanvas" width="400" height="600"></canvas>

<div class="info">
    <p><strong>COMANDI:</strong> Frecce ← → per muoverti, ↑ per accelerare.</p>
    <p>Evita le auto e sopravvivi il più possibile!</p>
</div>
