<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Retro Highway Racer</title>
    <style>
        :root {
            --bg-color: #0b0e14;
            --road-color: #333742;
            --grass-color: #1b4332;
            --stripe-color: #f8f9fa;
            --player-color: #e63946;
            --enemy-color: #4895ef;
            --accent-glow: #7209b7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        body {
            background-color: var(--bg-color);
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            touch-action: manipulation;
        }

        .game-header {
            text-align: center;
            margin-bottom: 12px;
            position: relative;
            width: 100%;
            max-width: 320px;
        }

        .btn-home {
            position: absolute;
            left: 0;
            top: 0;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 600;
            color: #fff;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            text-decoration: none;
            transition: all 0.2s ease;
            backdrop-filter: blur(4px);
        }

        .btn-home:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-1px);
        }

        .game-title {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(45deg, #f72585, #4cc9f0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            text-shadow: 0 0 15px rgba(247, 37, 133, 0.4);
        }

        .scoreboard {
            display: flex;
            justify-content: center;
            gap: 20px;
            font-size: 16px;
            margin-top: 6px;
            color: #a0aab2;
        }

        .scoreboard span strong {
            color: #fff;
        }

        .game-container {
            position: relative;
            width: 320px;
            height: 480px;
            background-color: var(--grass-color);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(114, 9, 183, 0.3), 0 0 0 4px rgba(255, 255, 255, 0.1);
            touch-action: none;
        }

        /* Strada */
        .road {
            position: absolute;
            left: 40px;
            width: 240px;
            height: 100%;
            background-color: var(--road-color);
            border-left: 6px solid #e9ecef;
            border-right: 6px solid #e9ecef;
        }

        /* Linee tratteggiate al centro */
        .lane-line {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 6px;
            height: 100%;
            background: repeating-linear-gradient(
                to bottom,
                var(--stripe-color) 0px,
                var(--stripe-color) 30px,
                transparent 30px,
                transparent 60px
            );
            animation: moveRoad 0.6s linear infinite;
        }

        @keyframes moveRoad {
            0% { transform: translateX(-50%) translateY(-60px); }
            100% { transform: translateX(-50%) translateY(0); }
        }

        /* Auto (Giocatore e Nemici) */
        .car {
            position: absolute;
            width: 40px;
            height: 70px;
            border-radius: 8px;
            transition: left 0.15s ease-out, top 0.15s ease-out;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }

        /* Dettagli estetici auto con CSS */
        .car::before {
            content: '';
            position: absolute;
            top: 15px;
            left: 5px;
            width: 30px;
            height: 25px;
            background-color: #111;
            border-radius: 4px;
        }

        .car::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 4px;
            width: 32px;
            height: 6px;
            background-color: #ffb703;
            border-radius: 2px;
            box-shadow: 0 62px 0 #d90429;
        }

        .player {
            background-color: var(--player-color);
            bottom: 20px;
            left: 140px; /* Corsia iniziale */
            z-index: 10;
        }

        .enemy {
            background-color: var(--enemy-color);
            top: -80px;
            z-index: 5;
        }

        /* Modal Overlay (Game Over & Start) */
        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(11, 14, 20, 0.85);
            backdrop-filter: blur(4px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
        }

        .overlay h2 {
            font-size: 24px;
            margin-bottom: 8px;
            color: #f72585;
        }

        .overlay p {
            font-size: 13px;
            color: #ccc;
            margin-bottom: 20px;
            text-align: center;
            padding: 0 10px;
        }

        .overlay-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 80%;
        }

        .btn-start {
            padding: 10px 24px;
            font-size: 14px;
            font-weight: 700;
            color: #fff;
            background: linear-gradient(135deg, #7209b7, #4361ee);
            border: none;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(67, 97, 238, 0.4);
            transition: transform 0.2s;
            text-align: center;
            text-decoration: none;
        }

        .btn-start:hover {
            transform: scale(1.05);
        }

        .btn-overlay-home {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: none;
        }

        /* Controlli Mobile / On-Screen */
        .controls {
            display: flex;
            gap: 15px;
            margin-top: 15px;
        }

        .ctrl-btn {
            width: 70px;
            height: 55px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            color: #fff;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            touch-action: manipulation;
        }

        .ctrl-btn:active {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div class="game-header">
        <a href="index.html" class="btn-home">🏠 Home</a>
        <div class="game-title">Retro Highway</div>
        <div class="scoreboard">
            <span>Punti: <strong id="score">0</strong></span>
            <span>Record: <strong id="highscore">0</strong></span>
        </div>
    </div>

    <div class="game-container" id="gameArea">
        <div class="road">
            <div class="lane-line" id="laneLine"></div>
        </div>

        <div class="car player" id="player"></div>
        <div class="car enemy" id="enemy"></div>

        <div class="overlay" id="overlay">
            <h2 id="overlayTitle">Retro Highway</h2>
            <p id="overlaySub">Usa i frecce, swipe o tap sui lati dello schermo per sterzare!</p>
            <div class="overlay-buttons">
                <button class="btn-start" id="startBtn" onclick="startGame()">GIOCA ORA</button>
                <a href="index.html" class="btn-start btn-overlay-home">TORNA ALLA HOME</a>
            </div>
        </div>
    </div>

    <div class="controls">
        <div class="ctrl-btn" id="btnLeft">◄</div>
        <div class="ctrl-btn" id="btnRight">►</div>
    </div>

    <script>
        const player = document.getElementById('player');
        const enemy = document.getElementById('enemy');
        const scoreEl = document.getElementById('score');
        const highscoreEl = document.getElementById('highscore');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlayTitle');
        const overlaySub = document.getElementById('overlaySub');
        const gameArea = document.getElementById('gameArea');

        // Posizioni corsie (X)
        const lanes = [65, 140, 215]; 
        let currentLane = 1;
        
        let enemyY = -80;
        let enemyLane = 1;
        let enemySpeed = 4;
        
        let score = 0;
        let highScore = 0;
        let isPlaying = false;
        let gameLoopId = null;

        function updatePlayerPosition() {
            player.style.left = lanes[currentLane] + 'px';
        }

        function moveLeft() {
            if (!isPlaying) return;
            if (currentLane > 0) {
                currentLane--;
                updatePlayerPosition();
            }
        }

        function moveRight() {
            if (!isPlaying) return;
            if (currentLane < lanes.length - 1) {
                currentLane++;
                updatePlayerPosition();
            }
        }

        // --- CONTROLLI TASTIERA ---
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') moveLeft();
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') moveRight();
        });

        // --- CONTROLLI TOUCH BOTTONI ---
        const btnLeft = document.getElementById('btnLeft');
        const btnRight = document.getElementById('btnRight');

        btnLeft.addEventListener('touchstart', (e) => { e.preventDefault(); moveLeft(); });
        btnLeft.addEventListener('click', () => moveLeft());

        btnRight.addEventListener('touchstart', (e) => { e.preventDefault(); moveRight(); });
        btnRight.addEventListener('click', () => moveRight());

        // --- CONTROLLI SWIPE ED EFFETTO TAP SULL'AREA DI GIOCO ---
        let touchStartX = 0;
        let touchStartY = 0;

        gameArea.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        }, { passive: true });

        gameArea.addEventListener('touchend', (e) => {
            if (!isPlaying) return;
            
            let touchEndX = e.changedTouches[0].screenX;
            let touchEndY = e.changedTouches[0].screenY;
            
            let diffX = touchEndX - touchStartX;
            let diffY = touchEndY - touchStartY;

            // Se lo swipe è prevalentemente orizzontale
            if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 30) {
                if (diffX > 0) moveRight();
                else moveLeft();
            } else if (Math.abs(diffX) <= 30 && Math.abs(diffY) <= 30) {
                // Tap semplice: tocca metà sinistra o destra dello schermo
                const rect = gameArea.getBoundingClientRect();
                const tapX = e.changedTouches[0].clientX - rect.left;
                if (tapX < rect.width / 2) moveLeft();
                else moveRight();
            }
        }, { passive: true });

        function resetEnemy() {
            enemyY = -80;
            enemyLane = Math.floor(Math.random() * 3);
            enemy.style.left = lanes[enemyLane] + 'px';
        }

        function startGame() {
            score = 0;
            enemySpeed = 5;
            currentLane = 1;
            updatePlayerPosition();
            resetEnemy();
            
            scoreEl.textContent = score;
            overlay.style.display = 'none';
            isPlaying = true;

            if (gameLoopId) cancelAnimationFrame(gameLoopId);
            gameLoop();
        }

        function gameOver() {
            isPlaying = false;
            if (score > highScore) {
                highScore = score;
                highscoreEl.textContent = highScore;
            }

            overlayTitle.textContent = "GAME OVER";
            overlaySub.textContent = "Punteggio finale: " + score;
            document.getElementById('startBtn').textContent = "RIPROVA";
            overlay.style.display = 'flex';
        }

        function gameLoop() {
            if (!isPlaying) return;

            // Muovi nemico
            enemyY += enemySpeed;
            enemy.style.top = enemyY + 'px';

            // Nemico oltre il bordo inferiore
            if (enemyY > 480) {
                score += 10;
                scoreEl.textContent = score;
                enemySpeed += 0.2; // Aumenta difficoltà
                resetEnemy();
            }

            // Controllo Collisione
            const playerY = 390; // Posizione fissa del player sull'asse Y (480 - 20 - 70)
            if (
                enemyLane === currentLane &&
                enemyY + 70 > playerY &&
                enemyY < playerY + 70
            ) {
                gameOver();
                return;
            }

            gameLoopId = requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
