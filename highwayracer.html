<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Retro Highway Racer+</title>
<style>
    * {
        box-sizing: border-box;
        user-select: none;
        -webkit-user-select: none;
        touch-action: manipulation;
    }

    body {
        margin: 0;
        background: #111;
        color: white;
        font-family: 'Courier New', monospace;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        overflow: hidden;
    }

    .header-bar {
        width: 100%;
        max-width: 400px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
        padding: 0 10px;
        font-weight: bold;
    }

    .btn-home {
        color: #fff;
        background: #222;
        border: 1px solid #fff;
        padding: 6px 12px;
        text-decoration: none;
        font-size: 12px;
        border-radius: 4px;
        transition: 0.2s;
    }

    .btn-home:hover {
        background: #fff;
        color: #000;
    }

    #gameCanvas {
        border: 4px solid #fff;
        background: #000;
        box-shadow: 0 0 25px rgba(255,255,255,0.25);
        max-width: 100%;
        max-height: 65vh;
    }

    .info {
        margin-top: 8px;
        text-align: center;
        font-size: 11px;
        opacity: 0.8;
    }

    .mobile-controls {
        display: flex;
        gap: 12px;
        margin-top: 10px;
    }

    .ctrl-btn {
        width: 75px;
        height: 50px;
        background: #222;
        border: 2px solid #fff;
        color: #fff;
        font-size: 20px;
        font-weight: bold;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 8px;
        cursor: pointer;
    }

    .ctrl-btn:active {
        background: #fff;
        color: #000;
    }

    .multiplier-text {
        color: #ffb703;
    }
</style>
</head>
<body>

<div class="header-bar">
    <a href="index.html" class="btn-home">🏠 HOME</a>
    <div>
        <span id="scoreText">PUNTI: 0</span>
        <span id="multiplierText" class="multiplier-text">(1x)</span>
    </div>
</div>

<canvas id="gameCanvas" width="400" height="600"></canvas>

<div class="controls mobile-controls">
    <div class="ctrl-btn" id="btnLeft">◄</div>
    <div class="ctrl-btn" id="btnAccel">▲</div>
    <div class="ctrl-btn" id="btnRight">►</div>
</div>

<div class="info">
    <p><strong>COMANDI:</strong> ← → per muoverti, ↑ per accelerare e raddoppiare i punti!</p>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreText = document.getElementById('scoreText');
    const multiplierText = document.getElementById('multiplierText');

    // Stato di gioco
    let gameOver = false;
    let score = 0;
    let distanceScore = 0;
    let speed = 5;
    let baseSpeed = 5;
    let roadOffsetY = 0;

    // Giocatore
    const player = {
        x: 180,
        y: 480,
        width: 40,
        height: 70,
        color: '#e63946',
        vx: 0,
        speedX: 7
    };

    // Input
    const keys = { left: false, right: false, up: false };

    // Gestione Nemici
    const enemies = [];
    function spawnEnemy() {
        const lanes = [60, 180, 300];
        const lane = lanes[Math.floor(Math.random() * lanes.length)];
        
        // Evita spawn sovrapposti
        const isOverlap = enemies.some(e => e.y < 100 && Math.abs(e.x - lane) < 10);
        if (!isOverlap) {
            enemies.push({
                x: lane,
                y: -80,
                width: 40,
                height: 70,
                color: '#4895ef',
                passed: false
            });
        }
    }

    // Controlli Tastiera Fluidi
    window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
        if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
        if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') keys.up = true;
        if (gameOver && (e.key === ' ' || e.key === 'Enter')) resetGame();
    });

    window.addEventListener('keyup', (e) => {
        if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
        if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
        if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') keys.up = false;
    });

    // Controlli Touch Migliorati
    const bindTouch = (id, keyName) => {
        const el = document.getElementById(id);
        const start = (e) => { e.preventDefault(); keys[keyName] = true; };
        const end = (e) => { e.preventDefault(); keys[keyName] = false; };
        
        el.addEventListener('touchstart', start, { passive: false });
        el.addEventListener('touchend', end, { passive: false });
        el.addEventListener('mousedown', start);
        el.addEventListener('mouseup', end);
        el.addEventListener('mouseleave', end);
    };

    bindTouch('btnLeft', 'left');
    bindTouch('btnRight', 'right');
    bindTouch('btnAccel', 'up');

    canvas.addEventListener('click', () => {
        if (gameOver) resetGame();
    });

    function update() {
        if (gameOver) return;

        // Velocità e Moltiplicatore Punti
        const multiplier = keys.up ? 2 : 1;
        speed = keys.up ? baseSpeed * 1.7 : baseSpeed;
        multiplierText.textContent = `(${multiplier}x)`;

        // Movimento orizzontale continuo e fluido
        player.vx = 0;
        if (keys.left) player.vx = -player.speedX;
        if (keys.right) player.vx = player.speedX;

        player.x += player.vx;

        // Limiti strada
        if (player.x < 45) player.x = 45;
        if (player.x > 315) player.x = 315;

        // Punteggio basato sulla distanza percorsa
        distanceScore += (speed / 10) * multiplier;
        score = Math.floor(distanceScore);
        scoreText.textContent = 'PUNTI: ' + score;

        // Animazione strada
        roadOffsetY = (roadOffsetY + speed) % 40;

        // Frequenza spawn dinamica basata sulla velocità base
        if (Math.random() < 0.02 + (baseSpeed * 0.002)) spawnEnemy();

        for (let i = enemies.length - 1; i >= 0; i--) {
            let enemy = enemies[i];
            enemy.y += speed - 2.5;

            // Bonus Sorpasso (Punti extra quando superi un'auto)
            if (!enemy.passed && enemy.y > player.y + player.height) {
                enemy.passed = true;
                distanceScore += 15 * multiplier; // Bonus +15 (+30 se in accelerazione)
            }

            // Collisione precisa (Box leggermente ridotto per tolleranza)
            const margin = 4;
            if (
                player.x + margin < enemy.x + enemy.width - margin &&
                player.x + player.width - margin > enemy.x + margin &&
                player.y + margin < enemy.y + enemy.height - margin &&
                player.y + player.height - margin > enemy.y
            ) {
                gameOver = true;
            }

            // Rimozione nemici fuori schermo
            if (enemy.y > canvas.height) {
                enemies.splice(i, 1);
            }
        }

        // Aumento graduale della difficoltà
        baseSpeed = 5 + Math.floor(score / 150) * 0.5;
    }

    function drawCar(x, y, color) {
        ctx.fillStyle = color;
        ctx.fillRect(x, y, 40, 70);
        // Parabrezza
        ctx.fillStyle = '#111';
        ctx.fillRect(x + 5, y + 15, 30, 20);
        // Fari anteriori / posteriori
        ctx.fillStyle = '#ffb703';
        ctx.fillRect(x + 4, y + 2, 8, 4);
        ctx.fillRect(x + 28, y + 2, 8, 4);
    }

    function draw() {
        // Bordi campo
        ctx.fillStyle = '#1b4332';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Strada
        ctx.fillStyle = '#262626';
        ctx.fillRect(40, 0, 320, canvas.height);

        // Linee di corsia tratteggiate
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 4;
        ctx.setLineDash([20, 20]);
        ctx.lineDashOffset = -roadOffsetY;

        ctx.beginPath();
        ctx.moveTo(146, 0);
        ctx.lineTo(146, canvas.height);
        ctx.moveTo(253, 0);
        ctx.lineTo(253, canvas.height);
        ctx.stroke();

        // Disegna Giocatore e Nemici
        drawCar(player.x, player.y, player.color);
        enemies.forEach(e => drawCar(e.x, e.y, e.color));

        // Schermata Game Over
        if (gameOver) {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#ff0055';
            ctx.font = '28px Courier New';
            ctx.textAlign = 'center';
            ctx.fillText('GAME OVER', canvas.width / 2, 260);

            ctx.fillStyle = '#fff';
            ctx.font = '16px Courier New';
            ctx.fillText('Punteggio Finale: ' + score, canvas.width / 2, 300);
            ctx.fillText('Premi Spazio o Clicca', canvas.width / 2, 340);
        }
    }

    function resetGame() {
        score = 0;
        distanceScore = 0;
        baseSpeed = 5;
        gameOver = false;
        enemies.length = 0;
        player.x = 180;
        scoreText.textContent = 'PUNTI: 0';
    }

    function gameLoop() {
        update();
        draw();
        requestAnimationFrame(gameLoop);
    }

    gameLoop();
</script>

</body>
</html>
