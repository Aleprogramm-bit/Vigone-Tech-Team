<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>VigoneTech Team</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        :root {
            --bg: #f5f5f5;
            --card-bg: #ffffffcc;
            --primary: #1a73e8;
            --text: #202124;
            --muted: #5f6368;
            --border: #dadce0;
            --shadow-sm: 0 2px 6px #00000022;
            --shadow-md: 0 4px 12px #00000022;
            --shadow-lg: 0 10px 26px #00000033;
        }

        /* Tema scuro */
        :root.dark {
            --bg: #0d0d0d;
            --card-bg: #1e1e1ecc;
            --primary: #8ab4f8;
            --text: #e8eaed;
            --muted: #9aa0a6;
            --border: #3c4043;
            --shadow-sm: 0 2px 6px #00000055;
            --shadow-md: 0 4px 12px #00000055;
            --shadow-lg: 0 10px 26px #00000077;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: url("back.png") no-repeat center center fixed;
            background-size: cover;
            color: var(--text);
        }

        /* HEADER */
        header {
            background: var(--card-bg);
            border-bottom: 1px solid var(--border);
            padding: 16px 28px;
            display: flex;
            align-items: center;
            gap: 16px;
            backdrop-filter: blur(12px);
            box-shadow: var(--shadow-md);
        }

        header .logo img {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--border);
            box-shadow: var(--shadow-sm);
        }

        header h1 {
            margin: 0;
            font-size: 26px;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        /* Pulsante tema */
        #themeToggle {
            margin-left: auto;
            padding: 8px 16px;
            font-size: 18px;
            cursor: pointer;
            background: #ffffff33;
            border: 1px solid #ffffff55;
            border-radius: 10px;
            color: var(--text);
            backdrop-filter: blur(6px);
            transition: 0.25s;
        }

        #themeToggle:hover {
            background: #ffffff55;
            transform: translateY(-2px);
        }

        /* CONTAINER */
        .container {
            max-width: 1100px;
            margin: 50px auto;
            padding: 0 20px;
        }

        h2 {
            font-size: 30px;
            margin-bottom: 30px;
            font-weight: 600;
            text-align: center;
            text-shadow: var(--shadow-sm);
        }

        /* CARDS */
        .cards {
            display: flex;
            gap: 26px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 26px;
            width: 300px;
            text-align: center;
            backdrop-filter: blur(10px);
            transition: transform 0.25s, box-shadow 0.25s;
            box-shadow: var(--shadow-md);
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow-lg);
        }

        .card img {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 16px;
            border: 2px solid var(--border);
            box-shadow: var(--shadow-sm);
        }

        .card h3 {
            margin: 14px 0;
            font-size: 21px;
            font-weight: 600;
        }

        .card p {
            font-size: 15px;
            color: var(--muted);
            line-height: 1.5;
        }

        /* BUTTON */
        .btn {
            display: inline-block;
            margin-top: 18px;
            padding: 12px 20px;
            background: var(--primary);
            color: #fff;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            transition: 0.25s;
            box-shadow: var(--shadow-sm);
        }

        .btn:hover {
            filter: brightness(0.92);
            transform: translateY(-3px);
        }
    </style>
</head>
<body>

<header>
    <div class="logo">
        <img src="techteam.jpg" alt="VigoneTech">
    </div>
    <h1>VigoneTech Team</h1>

    <button id="themeToggle">🌙</button>
</header>

<div class="container">
    <h2>I Nostri Progetti</h2>

    <div class="cards">

        <div class="card">
            <img src="logo2.png" alt="LorenzoOS">
            <h3>LorenzoOS</h3>
            <p>Il sistema operativo sviluppato da LoreTnani.</p>
            <a class="btn" href="main2.html">Vai al sito</a>
        </div>

        <div class="card">
            <img src="giornale.png" alt="Giornale">
            <h3>Giornale Tecnologico</h3>
            <p>Il giornale tecnologico scritto da Alessio.</p>
            <a class="btn" href="https://sites.google.com/view/curiositynews/tecnologie-avanzate">Vai al giornale</a>
        </div>

        <div class="card">
            <img src="aiuto.png" alt="Help">
            <h3>Contatti per assistenza informatica</h3>
            <p>I contatti di supporto.</p>
            <a class="btn" href="help.html">Vedi i contatti</a>
        </div>

    </div>
</div>

<script>
    const toggle = document.getElementById("themeToggle");

    toggle.addEventListener("click", () => {
        document.documentElement.classList.toggle("dark");
        toggle.textContent = document.documentElement.classList.contains("dark") ? "☀️" : "🌙";
    });
</script>

</body>
</html>
