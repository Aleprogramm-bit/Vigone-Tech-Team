<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>LoreTNani - OurVideos</title>
    <style>
        body { background: #0a0a0a; color: #c8ffc8; font-family: Arial; margin: 0; }
        header { background: #000; padding: 15px; border-bottom: 2px solid #00ff66; }
        h1 { text-align: center; color: #00ff66; }

        .card {
            background: #111;
            border: 1px solid #00ff66;
            border-radius: 10px;
            padding: 15px;
            margin: 15px;
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .card:hover { background: #1a1a1a; }

        .card img {
            width: 160px;
            height: 90px;
            border-radius: 8px;
            margin-right: 15px;
            object-fit: cover;
        }

        .title { font-size: 20px; color: #00ff66; }
    </style>
</head>
<body>

<header>
    <h1>LoreTNani – Videos</h1>
</header>

<div class="card" onclick="openVideo('https://mega.nz/embed/CCCCCCCC#DDDDDDDD')">
    <img src="1.png">
    <div class="title">Video 1</div>
</div>

<div class="card" onclick="openVideo('https://mega.nz/embed/EEEEEEEE#FFFFFFFF')">
    <img src="2.png">
    <div class="title">Video 2</div>
</div>

<script>
function openVideo(url) {
    window.open(url, "_blank");
}
</script>

</body>
</html>
