  <title>MyAI – Meteo 14 giorni</title>

    body {
      background: #0d0d0f;
      color: #0f0;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
    }

    .box {
      max-width: 900px;
      margin: 30px auto;
      padding: 20px;
      background: #1a1a1d;
      border-radius: 12px;
      border: 1px solid #0f0;
      box-shadow: 0 0 12px rgba(0,255,0,0.3);
    }

    #chat {
      height: 180px;
      overflow-y: auto;
      padding: 12px;
      background: #111;
      border-radius: 8px;
      border: 1px solid #0f0;
      margin-bottom: 12px;
    }

    .msg {
      margin: 8px 0;
      padding: 8px 12px;
      border-radius: 6px;
      max-width: 80%;
      line-height: 1.4;
    }

    .user {
      background: #2563eb;
      margin-left: auto;
      color: white;
    }

    .ai {
      background: #333;
      margin-right: auto;
      color: #0f0;
    }

    #input {
      width: calc(100% - 90px);
      padding: 10px;
      background: #222;
      border: 1px solid #0f0;
      border-radius: 6px;
      color: #0f0;
      font-size: 16px;
      outline: none;
    }

    #send {
      width: 80px;
      padding: 10px;
      background: #10b981;
      border: none;
      border-radius: 6px;
      color: #000;
      font-weight: bold;
      cursor: pointer;
    }

    #results {
      margin-top: 15px;
      padding: 12px;
      background: #111;
      border-radius: 8px;
      border: 1px solid #0f0;
      max-height: 500px;
      overflow-y: auto;
      color: #0f0;
      font-size: 14px;
      line-height: 1.6;
    }

    #results a {
      display: block;
      color: #10b981;
      text-decoration: none;
      margin: 6px 0;
    }

    #results a span {
      display: block;
      font-size: 12px;
      color: #9ca3af;
    }

    .section-title {
      margin-top: 10px;
      font-weight: bold;
      color: #10b981;
    }

    .day-separator {
      margin-top: 12px;
      margin-bottom: 6px;
      color: red;
      font-weight: bold;
      font-size: 16px;
    }

    .meteo-row {
      color: #0f0;
      margin: 2px 0;
      font-size: 13px;
    }
  </style>
</head>
<body>

    <h2>MyAI – Meteo 14 giorni</h2>

    <div id="chat">
      <div class="msg ai">Scrivi: meteo [provincia] oppure ricerca [testo]</div>
    </div>

    <input id="input" type="text" placeholder="Es: meteo torino o ricerca gaming">
    <button id="send">Invia</button>

    <div id="results">Nessun risultato ancora.</div>
  </div>

    const results = document.getElementById("results");

    function addMsg(text, type) {
      const div = document.createElement("div");
      div.className = "msg " + type;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    async function duckSearch(query) {
      const url = "https://api.duckduckgo.com/?q=" + encodeURIComponent(query) + "&format=json&no_redirect=1&no_html=1";
      const res = await fetch(url);
      return await res.json();
    }

    async function wikiSearch(query) {
      const url = "https://it.wikipedia.org/w/api.php?action=query&format=json&origin=*&prop=extracts&explaintext&titles=" + encodeURIComponent(query);
      const res = await fetch(url);
      const data = await res.json();
      const pages = data.query.pages;
      const id = Object.keys(pages)[0];
      return pages[id].extract || null;
    }

    function descriviMeteo(code, rain, snow) {
      if (code === 0) return "Soleggiato ☀️";
      if (code === 1) return "Prevalentemente soleggiato 🌤️";
      if (code === 2) return "Parzialmente nuvoloso ⛅";
      if (code === 3) return "Molto nuvoloso ☁️";
      if (code === 45 || code === 48) return "Nebbia 🌫️";
      if ([51,53,55].includes(code)) return "Pioviggine 🌦️";
      if ([61,63,65].includes(code)) return "Pioggia 🌧️";
      if ([66,67].includes(code)) return "Pioggia gelata 🧊";
      if ([71,73,75].includes(code)) return "Neve ❄️";
      if (code === 77) return "Granelli di neve ❄️";
      if ([80,81,82].includes(code)) return "Rovesci 🌧️";
      if (code === 95) return "Temporale ⛈️";
      if ([96,99].includes(code)) return "Temporale con grandine 🌩️";
      return "Condizione non riconosciuta";
    }

    async function getMeteo(localita) {
      const key = localita.toLowerCase();
      if (!coords[key]) return "Località non trovata.";

      const { lat, lon } = coords[key];
      const url =
        "https://api.open-meteo.com/v1/forecast?" +
        "latitude=" + lat + "&longitude=" + lon +
        "&current_weather=true" +
        "&hourly=temperature_2m,weathercode,rain,snowfall" +
        "&forecast_days=14" +
        "&timezone=auto";

      try {
        const res = await fetch(url);
        const data = await res.json();

        if (!data.hourly || !data.hourly.time) {
          return "Errore nel recupero meteo: dati mancanti.";
        }

        const now = new Date();
        const current = data.current_weather || {};
        const ore = data.hourly.time;
        const temp = data.hourly.temperature_2m;
        const codes = data.hourly.weathercode;
        const rain = data.hourly.rain;
        const snow = data.hourly.snowfall;

        let output = "";
        output += `<div class="section-title">Meteo di ${localita}</div>`;
        output += `<div class="meteo-row">Data: ${now.toLocaleDateString("it-IT")} • Ora: ${now.toLocaleTimeString("it-IT")}</div>`;
        output += `<div class="meteo-row">Attuale: ${descriviMeteo(current.weathercode ?? 0, 0, 0)}</div>`;
        output += `<div class="meteo-row">Temperatura: ${current.temperature ?? "-"}°C</div>`;
        output += `<div class="meteo-row">Vento: ${current.windspeed ?? "-"} km/h</div>`;
        output += `<br>`;

        let currentDay = "";
        for (let i = 0; i < ore.length; i++) {
          const dt = new Date(ore[i]);
          const giorno = dt.toLocaleDateString("it-IT");
          const oraStr = dt.toLocaleTimeString("it-IT", { hour: "2-digit", minute: "2-digit" });

          if (giorno !== currentDay) {
            currentDay = giorno;
            output += `<div class="day-separator">=== ${giorno} ===</div>`;
          }

          const descr = descriviMeteo(codes[i], rain[i], snow[i]);
          const rainText = rain[i] && rain[i] > 0 ? ` • 🌧️ ${Number(rain[i]).toFixed(1)} mm` : "";
          const snowText = snow[i] && snow[i] > 0 ? ` • ❄️ ${Number(snow[i]).toFixed(1)} mm` : "";

          output += `<div class="meteo-row">${oraStr} — ${descr} — ${temp[i]}°C${rainText}${snowText}</div>`;
        }

        return output;
      } catch (err) {
        return "Errore nel recupero meteo da OpenMeteo.";
      }
    }

    async function handleRicerca(query) {
      addMsg("ricerca " + query, "user");
      addMsg("Cerco su DuckDuckGo + Wikipedia...", "ai");
      results.innerHTML = "Sto cercando...";

      try {
        const duck = await duckSearch(query);
        const wiki = await wikiSearch(query);

        const topics = duck.RelatedTopics || [];
        const realLinks = [];

        for (const t of topics) {
          if (t.FirstURL) realLinks.push(t);
          if (realLinks.length >= 10) break;
        }

        results.innerHTML = "";

        const wikiTitle = document.createElement("div");
        wikiTitle.className = "section-title";
        wikiTitle.textContent = "Wikipedia:";
        results.appendChild(wikiTitle);

        if (wiki) {
          const wikiBox = document.createElement("div");
          wikiBox.textContent = wiki.slice(0, 600) + (wiki.length > 600 ? " [...]" : "");
          results.appendChild(wikiBox);
        } else {
          const wikiBox = document.createElement("div");
          wikiBox.textContent = "Nessuna voce trovata.";
          results.appendChild(wikiBox);
        }

        const duckTitle = document.createElement("div");
        duckTitle.className = "section-title";
        duckTitle.textContent = "Primi 10 risultati DuckDuckGo:";
        results.appendChild(duckTitle);

        if (realLinks.length) {
          realLinks.forEach(t => {
            const a = document.createElement("a");
            a.href = t.FirstURL;
            a.target = "_blank";
            a.textContent = t.Text || t.FirstURL;

            const span = document.createElement("span");
            span.textContent = t.FirstURL;
            a.appendChild(span);
            results.appendChild(a);
          });
        } else {
          const msg = document.createElement("div");
          msg.textContent = "Nessun risultato chiaro dall'API.";
          results.appendChild(msg);

          const link = document.createElement("a");
          link.href = "https://duckduckgo.com/?q=" + encodeURIComponent(query);
          link.target = "_blank";
          link.textContent = "Apri ricerca completa";
          results.appendChild(link);
        }
      } catch (e) {
        results.textContent = "Errore nella ricerca.";
      }
    }

    async function handle(inputText) {
      const text = inputText.trim();
      if (!text) return;

      const lower = text.toLowerCase();

      if (lower.startsWith("meteo ")) {
        const city = text.slice(6).trim();
        if (!city) {
          addMsg(text, "user");
          addMsg("Scrivi: meteo [provincia]", "ai");
          return;
        }

        addMsg("meteo " + city, "user");
        addMsg("Recupero meteo per " + city + "...", "ai");
        results.innerHTML = "Sto caricando il meteo...";
        const out = await getMeteo(city);
        results.innerHTML = out;
        return;
      }

      if (lower.startsWith("ricerca ")) {
        const query = text.slice(8).trim();
        if (!query) {
          addMsg(text, "user");
          addMsg("Scrivi: ricerca [testo]", "ai");
          return;
        }
        await handleRicerca(query);
        return;
      }

      addMsg(text, "user");
      addMsg("Comandi disponibili: meteo [provincia] oppure ricerca [testo]", "ai");
    }

    send.addEventListener("click", () => {
      handle(input.value);
      input.value = "";
    });

    input.addEventListener("keydown", e => {
      if (e.key === "Enter") {
        handle(input.value);
        input.value = "";
      }
    });
