  <title>MyAI – DuckDuckGo + Wikipedia + Meteo</title>
  <style>
    body { background:#0d0d0f; color:#fff; font-family:Arial; margin:0; }
    .box { max-width:700px; margin:40px auto; padding:20px; background:#1a1a1d; border-radius:10px; }
    #chat { height:150px; overflow-y:auto; padding:10px; background:#111; border-radius:8px; }
    .msg { margin:8px 0; padding:8px 12px; border-radius:6px; max-width:80%; }
    .user { background:#2563eb; margin-left:auto; }
    .ai { background:#333; margin-right:auto; }
    #input { width:calc(100% - 90px); padding:10px; background:#222; border:none; border-radius:6px; color:#fff; }
    #send { width:70px; padding:10px; background:#10b981; border:none; border-radius:6px; font-weight:bold; cursor:pointer; }
    #results {
      margin-top:15px;
      padding:10px;
      background:#111;
      border-radius:8px;
      font-size:14px;
      max-height:300px;
      overflow-y:auto;
    }
    #results a {
      display:block;
      color:#10b981;
      text-decoration:none;
      margin:6px 0;
    }
    #results a span {
      display:block;
      color:#9ca3af;
      font-size:12px;
    }
    .section-title {
      margin-top:10px;
      font-weight:bold;
      color:#10b981;
    }
  </style>
</head>
<body>
  <div class="box">
    <h2>MyAI – DuckDuckGo + Wikipedia + Meteo</h2>
    <div id="chat">
      <div class="msg ai">Scrivi una frase. Comandi: ricerca [testo] oppure meteo [provincia]</div>
    </div>

    <input id="input" type="text" placeholder="Es: ricerca farming simulator 25 oppure meteo torino">
    <button id="send">Invia</button>

    <div id="results">Nessun risultato ancora.</div>
  </div>

    const chat = document.getElementById("chat");
    const input = document.getElementById("input");
    const send = document.getElementById("send");
    const results = document.getElementById("results");

    function addMsg(text, type) {
      const div = document.createElement("div");
      div.className = "msg " + type;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    async function duckSearch(query) {
      const url = "https://api.duckduckgo.com/?q=" + encodeURIComponent(query) + "&format=json&no_redirect=1&no_html=1";
      const res = await fetch(url);
      return await res.json();
    }

    async function wikiSearch(query) {
      const url = "https://it.wikipedia.org/w/api.php?action=query&format=json&origin=*&prop=extracts&explaintext&titles=" + encodeURIComponent(query);
      const res = await fetch(url);
      const data = await res.json();
      const pages = data.query.pages;
      const id = Object.keys(pages)[0];
      return pages[id].extract || null;
    }

    function descriviMeteo(code) {
      if (code === 0) return "Soleggiato ☀️";
      if (code === 1) return "Prevalentemente soleggiato 🌤️";
      if (code === 2) return "Parzialmente nuvoloso ⛅";
      if (code === 3) return "Molto nuvoloso ☁️";
      if (code === 45 || code === 48) return "Nebbia 🌫️";
      if ([51,53,55].includes(code)) return "Pioviggine 🌦️";
      if ([61,63,65].includes(code)) return "Pioggia 🌧️";
      if ([66,67].includes(code)) return "Pioggia gelata 🧊";
      if ([71,73,75].includes(code)) return "Neve ❄️";
      if (code === 77) return "Granelli di neve ❄️";
      if ([80,81,82].includes(code)) return "Rovesci 🌧️";
      if (code === 95) return "Temporale ⛈️";
      if ([96,99].includes(code)) return "Temporale con grandine 🌩️";
      return "Condizione meteo non riconosciuta";
    }

    async function getMeteo(localita) {
      const key = localita.toLowerCase();
      if (!coords[key]) return "Località non trovata bro.";

      const { lat, lon } = coords[key];
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&timezone=auto`;

      try {
        const res = await fetch(url);
        const data = await res.json();
        const meteo = data.current_weather;

        let output = "";
        const now = new Date();
        const ora = now.toLocaleTimeString("it-IT");
        const dataStr = now.toLocaleDateString("it-IT");

        output += `<div><strong>Meteo ${localita} (${dataStr} ${ora})</strong></div>`;
        output += `<div>Condizione: ${descriviMeteo(meteo.weathercode)}</div>`;
        output += `<div>Temperatura: ${meteo.temperature}°C</div>`;
        output += `<div>Vento: ${meteo.windspeed} km/h</div>`;
        output += `<div>Direzione vento: ${meteo.winddirection}°</div>`;

        return output;
      } catch (err) {
        return "Errore nel recupero meteo bro.";
      }
    }

    async function handleRicerca(text) {
      const q = text.trim();
      if (!q) return;

      addMsg(q, "user");
      addMsg("Cerco su DuckDuckGo + Wikipedia...", "ai");
      results.innerHTML = "Sto cercando...";

      try {
        const duck = await duckSearch(q);
        const wiki = await wikiSearch(q);

        const topics = duck.RelatedTopics || [];
        const realLinks = [];

        for (const t of topics) {
          if (t.FirstURL) realLinks.push(t);
          if (realLinks.length >= 10) break;
        }

        results.innerHTML = "";

        const wikiTitle = document.createElement("div");
        wikiTitle.className = "section-title";
        wikiTitle.textContent = "Wikipedia:";
        results.appendChild(wikiTitle);

        if (wiki) {
          const wikiBox = document.createElement("div");
          wikiBox.textContent = wiki.slice(0, 600) + (wiki.length > 600 ? " [...]" : "");
          results.appendChild(wikiBox);
        } else {
          const wikiBox = document.createElement("div");
          wikiBox.textContent = "Nessuna voce trovata.";
          results.appendChild(wikiBox);
        }

        const duckTitle = document.createElement("div");
        duckTitle.className = "section-title";
        duckTitle.textContent = "Primi 10 risultati DuckDuckGo:";
        results.appendChild(duckTitle);

        if (realLinks.length) {
          realLinks.forEach(t => {
            const a = document.createElement("a");
            a.href = t.FirstURL;
            a.target = "_blank";
            a.textContent = t.Text || t.FirstURL;

            const span = document.createElement("span");
            span.textContent = t.FirstURL;

            a.appendChild(span);
            results.appendChild(a);
          });
        } else {
          const msg = document.createElement("div");
          msg.textContent = "Nessun risultato chiaro dall'API.";
          results.appendChild(msg);

          const link = document.createElement("a");
          link.href = "https://duckduckgo.com/?q=" + encodeURIComponent(q);
          link.target = "_blank";
          link.className = "fallback-btn";
          link.textContent = "Apri ricerca completa";
          results.appendChild(link);
        }

      } catch (e) {
        results.textContent = "Errore nella ricerca.";
      }
    }

    async function handle(text) {
      const q = text.trim().toLowerCase();
      if (!q) return;

      input.value = "";

      if (q.startsWith("meteo ")) {
        const localita = text.trim().slice(6).trim();
        if (!localita) {
          addMsg("meteo torino", "user");
          addMsg("Scrivi: meteo [provincia]", "ai");
          return;
        }
        addMsg("meteo " + localita, "user");
        addMsg("Recupero meteo per " + localita + "...", "ai");
        const meteoResult = await getMeteo(localita);
        results.innerHTML = meteoResult;
      } else if (q.startsWith("ricerca ")) {
        const query = text.trim().slice(8).trim();
        if (!query) {
          addMsg("ricerca farming simulator", "user");
          addMsg("Scrivi: ricerca [termine]", "ai");
          return;
        }
        handleRicerca(query);
      } else {
        addMsg(text, "user");
        addMsg("Comandi disponibili: ricerca [testo] oppure meteo [provincia]", "ai");
      }
    }

    send.addEventListener("click", () => handle(input.value));
    input.addEventListener("keydown", e => {
      if (e.key === "Enter") handle(input.value);
    });
