<p>Comandi: <b>meteo &lt;provincia&gt;</b>, <b>parla &lt;testo&gt;</b>, <b>ascolta</b></p>

<input id="inputBox" placeholder="Scrivi un comando bro...">
<button id="sendBtn">Invia</button>

const input = document.getElementById("inputBox");
const output = document.getElementById("output");
const sendBtn = document.getElementById("sendBtn");

sendBtn.addEventListener("click", eseguiComando);
input.addEventListener("keydown", e => { if (e.key === "Enter") eseguiComando(); });

function setOutput(text) { output.innerHTML = text; }

// ---- TRADUZIONE METEO ----
function descriviMeteo(code, rain, snow) {
  if (code === 0) return "Soleggiato ☀️";
  if (code === 1) return "Prevalentemente soleggiato 🌤️";
  if (code === 2) return "Parzialmente nuvoloso ⛅";
  if (code === 3) return "Molto nuvoloso ☁️";
  if (code === 45 || code === 48) return "Nebbia 🌫️";
  if ([51,53,55].includes(code)) return `Pioviggine (${rain} mm) 🌦️`;
  if ([61,63,65].includes(code)) return `Pioggia (${rain} mm) 🌧️`;
  if ([66,67].includes(code)) return `Pioggia gelata (${rain} mm) 🧊`;
  if ([71,73,75].includes(code)) return `Neve (${snow} mm) ❄️`;
  if (code === 77) return "Granelli di neve ❄️";
  if ([80,81,82].includes(code)) return `Rovesci (${rain} mm) 🌧️`;
  if (code === 95) return "Temporale ⛈️";
  if ([96,99].includes(code)) return "Temporale con grandine 🌩️";
  return "Condizione meteo non riconosciuta bro.";
}

// ---- METEO ----
async function getMeteo(localita) {
  const key = localita.toLowerCase();
  if (!coords[key]) return "Località non trovata bro.";

  const { lat, lon } = coords[key];
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&hourly=precipitation,rain,snowfall`;

  try {
    const res = await fetch(url);
    const data = await res.json();

    const meteo = data.current_weather;
    const index = data.hourly.time.indexOf(meteo.time);

    const rain = data.hourly.rain[index];
    const snow = data.hourly.snowfall[index];

    const descrizione = descriviMeteo(meteo.weathercode, rain, snow);

    const now = new Date();
    const ora = now.toLocaleTimeString("it-IT");
    const dataStr = now.toLocaleDateString("it-IT");

    return `Meteo ${localita} (${dataStr} ${ora})\n` +
           `${descrizione}\n\n` +
           `Temperatura: ${meteo.temperature}°C\n` +
           `Vento: ${meteo.windspeed} km/h\n` +
           `Direzione vento: ${meteo.winddirection}°\n` +
           `Pioggia: ${rain} mm\n` +
           `Neve: ${snow} mm`;

  } catch (err) {
    return "Errore nel recupero meteo bro.";
  }
}

// ---- PARLA ----
function parla(text) {
  if (!text.trim()) {
    setOutput("Dimmi cosa devo dire bro.");
    return;
  }
  const msg = new SpeechSynthesisUtterance(text);
  msg.lang = "it-IT";
  speechSynthesis.speak(msg);
  setOutput(`Sto dicendo: "${text}"`);
}

// ---- ASCOLTA ----
function ascolta() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    setOutput("Il tuo browser non supporta il riconoscimento vocale bro.");
    return;
  }

  const rec = new SpeechRecognition();
  rec.lang = "it-IT";
  rec.interimResults = false;
  rec.maxAlternatives = 1;

  setOutput("Sto ascoltando... parla bro.");

  rec.onresult = e => {
    const text = e.results[0][0].transcript;
    setOutput(`Ho sentito: "${text}"`);
  };

  rec.onerror = e => {
    setOutput("Errore nel microfono bro: " + e.error);
  };

  rec.start();
}

// ---- COMANDI ----
function eseguiComando() {
  const q = input.value.trim();
  if (!q) {
    setOutput("Scrivi qualcosa bro.");
    return;
  }

  const lower = q.toLowerCase();

  if (lower.startsWith("meteo")) {
    const localita = q.slice(6).trim();
    if (!localita) {
      setOutput("Scrivi: meteo <provincia>");
      return;
    }
    setOutput("Recupero meteo per " + localita + "...");
    getMeteo(localita).then(r => setOutput(r));
    return;
  }

  if (lower.startsWith("parla")) {
    const text = q.slice(6).trim();
    parla(text);
    return;
  }

  if (lower === "ascolta") {
    ascolta();
    return;
  }

  setOutput("Comando non riconosciuto bro.\nProva: meteo <provincia>, parla <testo>, ascolta.");
}
