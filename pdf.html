<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDF Tools</title>
  <style>
    :root {
      --bg: #000000;
      --neon: #39ff14;
      --neon-soft: #1aff7a;
      --card-bg: #050505;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--neon);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .container {
      display: flex;
      flex-wrap: wrap; /* Permette alle card di andare a capo sui dispositivi mobili */
      justify-content: center;
      gap: 2rem;
      max-width: 1200px;
      width: 100%;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--neon-soft);
      border-radius: 12px;
      padding: 1.5rem;
      width: 280px;
      box-shadow: 0 0 15px rgba(57, 255, 20, 0.4);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 1rem;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 0 25px rgba(57, 255, 20, 0.7);
    }

    /* Contenitore immagine: blocca le dimensioni massime */
    .card-img-wrapper {
      width: 100%;
      height: 120px; /* Altezza fissa per l'immagine */
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 0.5rem;
      overflow: hidden;
    }

    /* Forza l'immagine a stare dentro il contenitore senza deformarsi */
    .card img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain; /* Adatta l'immagine senza tagliarla o farla uscire */
      border-radius: 6px;
    }

    .card-title {
      font-size: 1.2rem;
      font-weight: bold;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .card-desc {
      font-size: 0.9rem;
      color: var(--neon-soft);
      line-height: 1.4;
      flex-grow: 1; /* Spinge il pulsante sempre verso il basso */
    }

    .card a {
      display: block;
      text-decoration: none;
      color: var(--bg);
      background: var(--neon);
      padding: 0.6rem 1.2rem;
      border-radius: 999px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      font-size: 0.8rem;
      text-align: center;
      box-shadow: 0 0 10px rgba(57, 255, 20, 0.7);
      border: 1px solid transparent;
      transition: background 0.15s ease, color 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    }

    .card a:hover {
      background: var(--bg);
      color: var(--neon);
      box-shadow: 0 0 18px rgba(57, 255, 20, 1);
      border-color: var(--neon);
    }

    /* Stile per il badge "PDF" opzionale */
    .badge {
      align-self: flex-start;
      background: rgba(57, 255, 20, 0.2);
      border: 1px solid var(--neon);
      color: var(--neon);
      font-size: 0.7rem;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      text-transform: uppercase;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="container">

    <!-- Card 1: Presentazione -->
    <div class="card">
      <div>
        <span class="badge">PDF</span>
        <div class="card-img-wrapper" style="margin-top: 0.5rem;">
          <img src="f.png" alt="Presentazione" loading="lazy" onerror="this.src='https://placeholder.com'">
        </div>
        <div class="card-title">Presentazione</div>
        <div class="card-desc">
          Ecco il PDF di presentazione ufficiale del progetto.
        </div>
      </div>
      <a href="vigonetechteam.pdf">Leggi Ora</a>
    </div>
    
    <!-- Card 2: Modifica sul web -->
    <div class="card">
      <div>
        <div class="card-img-wrapper">
          <img src="a.png" alt="Modifica" loading="lazy" onerror="this.src='https://placeholder.com'">
        </div>
        <div class="card-title">Modifica sul web</div>
        <div class="card-desc">
          Apri <strong>editor.html</strong> direttamente nel browser per modificare il contenuto online.
        </div>
      </div>
      <a href="editor.html">Apri editor</a>
    </div>

    <!-- Card 3: Download diretto -->
    <div class="card">
      <div>
        <div class="card-img-wrapper">
          <img src="a.png" alt="Download" loading="lazy" onerror="this.src='https://placeholder.com'">
        </div>
        <div class="card-title">Download diretto</div>
        <div class="card-desc">
          Scarica subito i file per tuo browser.
        </div>
      </div>
      <a href="editor.zip" download="editor.zip">Scarica estensione</a>
    </div>

  </div>

</body>
</html>
