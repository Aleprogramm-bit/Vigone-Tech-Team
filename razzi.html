<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Rocket Duel</title>
    <style>
        body {
            margin: 0;
            background: #050510;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #gameContainer {
            position: relative;
            width: 800px;
            height: 450px;
        }
        #gameCanvas {
            border: 3px solid #00ff66;
            background: #020208;
            box-shadow: 0 0 25px rgba(0, 255, 102, 0.2);
        }
        .game-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 800px;
            height: 450px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }
        .menu-box {
            background: rgba(2, 2, 8, 0.9);
            border: 2px solid #00ff66;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            pointer-events: auto;
        }
        .btn {
            background: #000;
            color: #00ff66;
            border: 2px solid #00ff66;
            padding: 10px 20px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin: 5px;
            transition: all 0.2s ease;
        }
        .btn:hover {
            background: #00ff66;
            color: #000;
            box-shadow: 0 0 10px #00ff66;
        }
        .controls {
            display: flex;
            gap: 40px;
            margin-top: 15px;
            font-size: 13px;
            text-align: center;
        }
        .p1 { color: #ff3333; }
        .p2 { color: #3333ff; }
    </style>
</head>
<body>

    <div id="gameContainer">
        <canvas id="gameCanvas" width="800" height="450"></canvas>
        
        <!-- Menu iniziale -->
        <div id="menuOverlay" class="game-overlay">
            <div class="menu-box">
                <h2 style="margin-top: 0; font-size: 20px;">SCEGLI MODALITÀ:</h2>
                <button class="btn" onclick="startRocketGame('bot')">VS COMPUTER (BOT)</button>
                <button class="btn" onclick="startRocketGame('pvp')">2 GIOCATORI</button>
            </div>
        </div>

        <!-- Schermata Vittoria -->
        <div id="winOverlay" class="game-overlay" style="display: none;">
            <div class="menu-box" style="border-color: #ffcc00;">
                <h2 id="winMessage" style="color: #ffcc00; margin-top: 0;"></h2>
                <p style="margin-bottom: 15px;">Partita conclusa a 10 punti!</p>
                <button class="btn" onclick="resetToMenu()">GIOCA ANCORA</button>
            </div>
        </div>
    </div>
    
    <div class="controls">
        <div class="p1">
            <strong>P1 (Rosso):</strong> Muoviti <kbd>W</kbd>/<kbd>S</kbd> | Spara <kbd>Spazio</kbd>
        </div>
        <div class="p2" id="p2Instructions">
            <strong>P2 (Blu):</strong> Muoviti <kbd>↑</kbd>/<kbd>↓</kbd> | Spara <kbd>Invio</kbd>
        </div>
    </div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const p1 = { x: 40, y: 200, w: 30, h: 50, speed: 6, score: 0, color: "#ff3333", lastShot: 0 };
const p2 = { x: 730, y: 200, w: 30, h: 50, speed: 5, score: 0, color: "#3333ff", lastShot: 0 };

let projectiles = [];
let particles = [];
const shootCooldown = 400; 

let gameMode = 'pvp'; 
let isPlaying = false;

const keys = {};
window.addEventListener("keydown", e => { keys[e.key] = true; });
window.addEventListener("keyup", e => { keys[e.key] = false; });

function startRocketGame(mode) {
    gameMode = mode;
    document.getElementById("menuOverlay").style.display = "none";
    document.getElementById("winOverlay").style.display = "none";
    
    const p2Inst = document.getElementById("p2Instructions");
    if (mode === 'bot') {
        p2Inst.innerHTML = "<strong>P2 (BOT):</strong> Controllato dall'I.A.";
    } else {
        p2Inst.innerHTML = "<strong>P2 (Blu):</strong> Muoviti <kbd>↑</kbd>/<kbd>↓</kbd> | Spara <kbd>Invio</kbd>";
    }

    p1.score = 0;
    p2.score = 0;
    p1.y = 200;
    p2.y = 200;
    projectiles = [];
    particles = [];
    isPlaying = true;
}

function resetToMenu() {
    document.getElementById("winOverlay").style.display = "none";
    document.getElementById("menuOverlay").style.display = "flex";
    isPlaying = false;
}

function checkScores() {
    if (p1.score >= 10) {
        finishGame("IL GIOCATORE 1 VINCE!");
    } else if (p2.score >= 10) {
        finishGame(gameMode === 'bot' ? "IL COMPUTER VINCE!" : "IL GIOCATORE 2 VINCE!");
    }
}

function finishGame(msg) {
    isPlaying = false;
    document.getElementById("winMessage").innerText = msg;
    document.getElementById("winOverlay").style.display = "flex";
}

function createExplosion(x, y, color) {
    for (let i = 0; i < 15; i++) {
        particles.push({
            x: x, y: y,
            vx: (Math.random() - 0.5) * 6,
            vy: (Math.random() - 0.5) * 6,
            radius: Math.random() * 3 + 1,
            alpha: 1,
            color: color
        });
    }
}

function update() {
    if (!isPlaying) return;
    const now = Date.now();

    if ((keys["w"] || keys["W"]) && p1.y > 10) p1.y -= p1.speed;
    if ((keys["s"] || keys["S"]) && p1.y < canvas.height - p1.h - 10) p1.y += p1.speed;
    if (keys[" "] && now - p1.lastShot > shootCooldown) {
        projectiles.push({ x: p1.x + p1.w, y: p1.y + p1.h/2 - 3, vx: 8, color: p1.color, owner: 1 });
        p1.lastShot = now;
    }

    if (gameMode === 'pvp') {
        if (keys["ArrowUp"] && p2.y > 10) p2.y -= p2.speed;
        if (keys["ArrowDown"] && p2.y < canvas.height - p2.h - 10) p2.y += p2.speed;
        if (keys["Enter"] && now - p2.lastShot > shootCooldown) {
            projectiles.push({ x: p2.x, y: p2.y + p2.h/2 - 3, vx: -8, color: p2.color, owner: 2 });
            p2.lastShot = now;
        }
    } else {
        let incoming = null;
        let minX = 9999;
        projectiles.forEach(p => {
            if (p.owner === 1 && p.x < minX) { minX = p.x; incoming = p; }
        });

        if (incoming && incoming.x > canvas.width / 2) {
            let targetY = incoming.y - p2.h / 2;
            if (p2.y < targetY && p2.y > 10) p2.y -= p2.speed;
            else if (p2.y > targetY && p2.y < canvas.height - p2.h - 10) p2.y += p2.speed;
        } else {
            let targetY = p1.y;
            if (p2.y < targetY - 10 && p2.y > 10) p2.y += p2.speed;
            else if (p2.y > targetY + 10 && p2.y < canvas.height - p2.h - 10) p2.y -= p2.speed;
        }

        if (Math.abs(p2.y - p1.y) < 40 && now - p2.lastShot > (shootCooldown + 200)) {
            projectiles.push({ x: p2.x, y: p2.y + p2.h/2 - 3, vx: -8, color: p2.color, owner: 2 });
            p2.lastShot = now;
        }
    }

    for (let i = projectiles.length - 1; i >= 0; i--) {
        const p = projectiles[i];
        p.x += p.vx;

        if (p.owner === 1 && p.x > p2.x && p.x < p2.x + p2.w && p.y > p2.y && p.y < p2.y + p2.h) {
            p1.score++;
            createExplosion(p.x, p.y, p2.color);
            projectiles.splice(i, 1);
            checkScores();
            continue;
        }

        if (p.owner === 2 && p.x > p1.x && p.x < p1.x + p1.w && p.y > p1.y && p.y < p1.y + p1.h) {
            p2.score++;
            createExplosion(p.x, p.y, p1.color);
            projectiles.splice(i, 1);
            checkScores();
            continue;
        }

        if (p.x < 0 || p.x > canvas.width) projectiles.splice(i, 1);
    }

    for (let i = particles.length - 1; i >= 0; i--) {
        const pt = particles[i];
        pt.x += pt.vx; pt.y += pt.vy; pt.alpha -= 0.02;
        if (pt.alpha <= 0) particles.splice(i, 1);
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = "rgba(0, 255, 102, 0.04)";
    ctx.lineWidth = 1;
    for (let i = 0; i < canvas.width; i += 40) {
        ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
    }
    for (let j = 0; j < canvas.height; j += 40) {
        ctx.beginPath(); ctx.moveTo(0, j); ctx.lineTo(canvas.width, j); ctx.stroke();
    }

    ctx.fillStyle = p1.color;
    ctx.beginPath();
    ctx.moveTo(p1.x, p1.y); ctx.lineTo(p1.x + p1.w - 10, p1.y); ctx.lineTo(p1.x + p1.w, p1.y + p1.h/2);
    ctx.lineTo(p1.x + p1.w - 10, p1.y + p1.h); ctx.lineTo(p1.x, p1.y + p1.h);
    ctx.closePath(); ctx.fill();

    ctx.fillStyle = p2.color;
    ctx.beginPath();
    ctx.moveTo(p2.x + p2.w, p2.y); ctx.lineTo(p2.x + 10, p2.y); ctx.lineTo(p2.x, p2.y + p2.h/2);
    ctx.lineTo(p2.x + 10, p2.y + p2.h); ctx.lineTo(p2.x + p2.w, p2.y + p2.h);
    ctx.closePath(); ctx.fill();

    projectiles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, 15, 6);
    });

    particles.forEach(pt => {
        ctx.fillStyle = pt.color; ctx.globalAlpha = pt.alpha;
        ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.radius, 0, Math.PI * 2); ctx.fill();
    });
    ctx.globalAlpha = 1.0; 

    ctx.font = "24px 'Courier New'";
    ctx.fillStyle = p1.color; ctx.fillText(p1.score, canvas.width / 2 - 60, 40);
    ctx.fillStyle = "#00ff66"; ctx.fillText("-", canvas.width / 2 - 8, 40);
    ctx.fillStyle = p2.color; ctx.fillText(p2.score, canvas.width / 2 + 40, 40);
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

</body>
</html>
